[project]
name = "hsi-ssat"
version = "0.1.0"
description = "Spectral-Spatial Attention Transformer with Dense Connection for hyperspectral image classification, with corrected CBAM and HybridSN baselines."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi_ssat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
